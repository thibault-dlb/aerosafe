# Fixed project name, whatever the folder the repository is cloned into: images, volumes and
# networks are always prefixed with "aerosafe", so they can be found and removed reliably.
name: aerosafe

services:
  postgres:
    image: docker.io/postgis/postgis:17-3.7-alpine
    container_name: aerosafe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASS: ${DB_MIGRATION_PASS}
    volumes:
      - ./src/api/docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro,z
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aerosafe-net
    healthcheck:
      # TCP, not the Unix socket: during the first start the image runs a temporary server
      # on the socket only, which would report the database ready before it accepts the API.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    container_name: aerosafe_api
    restart: unless-stopped
    volumes:
      - ./src/api:/app:z
      - /app/.venv
    env_file:
      - .env
    networks:
      - aerosafe-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  front:
    build:
      context: ./src/front
      dockerfile: Dockerfile
    container_name: aerosafe_front
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8888/api}
    networks:
      - aerosafe-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 10

  gateway:
    image: docker.io/library/nginx:1.27-alpine
    container_name: aerosafe_gateway
    restart: unless-stopped
    volumes:
      - ./src/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
    ports:
      - "8888:80"
    networks:
      - aerosafe-net
    depends_on:
      - api
      - front
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  aerosafe-net:
    driver: bridge
